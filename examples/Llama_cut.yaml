slices:
  - sources:
      - model: /path/to/run/checkpoints/checkpoint-1
        layer_range: [0, 0]
  - sources:
      - model: /path/to/run/checkpoints/checkpoint-1
        layer_range: [0, 16]
  - sources:
      - model: /path/to/run/checkpoints/checkpoint-2
        layer_range: [16, 32]
  - sources:
      - model: /path/to/run/checkpoints/checkpoint-2
        layer_range: [33, 33]
  - sources:
      - model: /path/to/run/checkpoints/checkpoint-1
        layer_range: [34, 34]


post_weights:
  - name: lm_head.weight
    model: /path/to/run/checkpoints/checkpoint-2
  - name: model.embed_tokens.weight
    model: /path/to/run/checkpoints/checkpoint-1

pre_weights:
  - name: model.norm.weight
    model: /path/to/run/checkpoints/checkpoint-1

merge_method: passthrough
dtype: bfloat16